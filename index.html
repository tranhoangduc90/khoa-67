<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23991b1b'/%3E%3Cpath d='M18 34h18m-18-9h28M18 43h28' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Nộp bài tập hằng ngày</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dde5;
      --strong: #991b1b;
      --strong-hover: #7f1d1d;
      --focus: #2563eb;
      --ok: #067647;
      --ok-bg: #ecfdf3;
      --err: #b42318;
      --err-bg: #fef3f2;
      --warn: #92400e;
      --warn-bg: #fffbeb;
      --chip: #eef2f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, system-ui, sans-serif;
      background:
        linear-gradient(180deg, #ffffff 0, var(--bg) 230px),
        var(--bg);
      color: var(--ink);
    }

    .shell {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: grid;
      gap: 6px;
    }

    .eyebrow {
      color: var(--strong);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .status-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 20px;
      margin-top: 24px;
      align-items: start;
    }

    .panel,
    .summary {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(22, 29, 36, 0.06);
    }

    .panel {
      padding: 22px;
    }

    .summary {
      padding: 18px;
      position: sticky;
      top: 16px;
    }

    form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 14px;
    }

    label {
      color: #344054;
      font-size: 14px;
      font-weight: 700;
    }

    select,
    input,
    textarea,
    button {
      width: 100%;
      font: inherit;
      border-radius: 8px;
    }

    select,
    input,
    textarea {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 12px 13px;
      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      line-height: 1.5;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }

    button {
      min-height: 44px;
      border: 1px solid transparent;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .primary {
      color: #fff;
      background: var(--strong);
      border-color: var(--strong);
    }

    .primary:hover:not(:disabled) {
      background: var(--strong-hover);
      border-color: var(--strong-hover);
    }

    .secondary {
      color: #344054;
      background: #fff;
      border-color: var(--line);
    }

    .secondary:hover:not(:disabled) {
      background: #f8fafc;
    }

    .result {
      display: none;
      border-radius: 8px;
      padding: 12px 13px;
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .result.show {
      display: block;
    }

    .result.ok {
      color: var(--ok);
      background: var(--ok-bg);
      border: 1px solid #abefc6;
    }

    .result.error {
      color: var(--err);
      background: var(--err-bg);
      border: 1px solid #fecdca;
    }

    .result.warn {
      color: var(--warn);
      background: var(--warn-bg);
      border: 1px solid #fedf89;
    }

    .summary h2 {
      margin: 0 0 14px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .metric {
      display: grid;
      gap: 4px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .metric:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .metric strong {
      font-size: 20px;
      line-height: 1.2;
    }

    .preview {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .preview-list {
      display: grid;
      gap: 7px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .link-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 2px;
      padding: 9px 10px;
      border-radius: 8px;
      background: var(--chip);
      font-size: 13px;
    }

    .link-item.blocked {
      background: var(--err-bg);
      color: var(--err);
    }

    .link-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-preview {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .footer-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 18px;
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 24px, 620px);
        padding-top: 16px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        grid-template-columns: 1fr;
      }

      .summary {
        position: static;
      }
    }

    @media (max-width: 560px) {
      .panel,
      .summary {
        padding: 16px;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div class="eyebrow">Khoa 67</div>
        <h1>Nộp bài tập hằng ngày</h1>
      </div>
      <div class="status-pill" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="connectionStatus">Sẵn sàng nhận bài</span>
      </div>
    </header>

    <main>
      <section class="panel" aria-label="Biểu mẫu nộp bài">
        <form id="submitForm">
          <div class="field-row">
            <div class="field">
              <label for="classSelect">Lớp</label>
              <select id="classSelect" required>
                <option value="">Chọn lớp</option>
              </select>
            </div>

            <div class="field">
              <label for="studentName">Học viên</label>
              <input id="studentName" name="studentName" type="text" autocomplete="name" placeholder="Nhập đúng họ tên" required>
            </div>
          </div>

          <div class="field">
            <label for="linkInput">Link bài tập</label>
            <textarea id="linkInput" placeholder="Dán một hoặc nhiều link vào đây" required></textarea>
            <div class="hint">Không nhận link dạng chatgpt.com/c. Dùng link share hoặc link bài tập hợp lệ.</div>
          </div>

          <div class="actions">
            <button class="primary" id="submitBtn" type="submit" disabled>Gửi bài</button>
            <button class="secondary" id="clearBtn" type="button">Xóa link</button>
          </div>

          <div class="result" id="resultMsg" role="status" aria-live="polite"></div>
        </form>
      </section>

      <aside class="summary" aria-label="Tóm tắt bài nộp">
        <h2>Tóm tắt</h2>
        <div class="metric">
          <span>Số link hợp lệ</span>
          <strong id="validCount">0</strong>
        </div>
        <div class="metric">
          <span>Link bị chặn</span>
          <strong id="blockedCount">0</strong>
        </div>

        <div class="preview">
          <div class="hint">Link đã tách</div>
          <div class="preview-list" id="previewList">
            <div class="empty-preview">Chưa có link hợp lệ.</div>
          </div>
        </div>

        <div class="footer-note">Sau khi gửi thành công, hệ thống giữ lớp và tên học viên trên thiết bị này.</div>
      </aside>
    </main>
  </div>

  <script>
    const WEBHOOK_URL = 'https://ducizone.ddns.net/webhook/0510dc1f-669b-4fa8-be7a-31d596f562a9';
    const REJECT_IF_BLOCKED_LINKS_FOUND = true;
    const CLASS_LIST = [
      'IC2063',
      'IC2091',
      'IC2103',
      'IC2115',
      'IC2111',
      'IC2129',
      'IC2131',
      'IC2150',
      'IC2146',
      'IC2145',
      'IC2168',
      'IC2139',
      'IC2172',
      'IC2181',
      'IC2200'
    ];

    const STORAGE_KEY = 'khoa67SubmissionProfile';
    const classSelect = document.getElementById('classSelect');
    const studentName = document.getElementById('studentName');
    const linkInput = document.getElementById('linkInput');
    const submitForm = document.getElementById('submitForm');
    const submitBtn = document.getElementById('submitBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultMsg = document.getElementById('resultMsg');
    const validCount = document.getElementById('validCount');
    const blockedCount = document.getElementById('blockedCount');
    const previewList = document.getElementById('previewList');
    const connectionStatus = document.getElementById('connectionStatus');

    let currentLinks = [];
    let currentBlocked = [];

    function splitConcatenatedHttpLinks(value) {
      if (!value) return [];
      const regex = /https?:\/\//gi;
      const indexes = [];
      let match;
      while ((match = regex.exec(value)) !== null) indexes.push(match.index);
      if (indexes.length <= 1) return [value];

      return indexes.map((start, index) => {
        const end = indexes[index + 1] || value.length;
        return value.slice(start, end);
      });
    }

    function isBlockedLink(url) {
      return /^https?:\/\/(?:www\.)?chatgpt\.com\/c\/.+/i.test(String(url || '').trim());
    }

    function normalizeUrl(url) {
      return String(url || '').replace(/[.,);>\]\s]+$/g, '').trim();
    }

    function uniq(values) {
      const seen = new Set();
      const output = [];
      for (const value of values) {
        if (!value || seen.has(value)) continue;
        seen.add(value);
        output.push(value);
      }
      return output;
    }

    function extractLinks(input) {
      if (!input) return { links: [], blocked: [] };

      const httpRegex = /https?:\/\/[^\s<>"')]+/gi;
      const rawMatches = input.match(httpRegex) || [];
      const httpMatches = rawMatches.flatMap(splitConcatenatedHttpLinks);

      const domainRegex = /(?:^|\s)((?:www\.)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\/\S*)?)/gi;
      const domainMatches = [];
      let domainMatch;
      while ((domainMatch = domainRegex.exec(input)) !== null) {
        const candidate = String(domainMatch[1] || '').trim();
        if (!candidate || candidate.includes('@') || /^https?:\/\//i.test(candidate)) continue;
        domainMatches.push('https://' + candidate);
      }

      const deduped = uniq(httpMatches.concat(domainMatches).map(normalizeUrl));
      return deduped.reduce((acc, url) => {
        if (isBlockedLink(url)) acc.blocked.push(url);
        else acc.links.push(url);
        return acc;
      }, { links: [], blocked: [] });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function setResult(type, message) {
      resultMsg.className = 'result show ' + type;
      resultMsg.textContent = message;
    }

    function clearResult() {
      resultMsg.className = 'result';
      resultMsg.textContent = '';
    }

    function saveProfile() {
      const profile = {
        lop: classSelect.value,
        hocVien: studentName.value.trim()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
    }

    function loadProfile() {
      try {
        const profile = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (CLASS_LIST.includes(profile.lop)) classSelect.value = profile.lop;
        if (profile.hocVien) studentName.value = profile.hocVien;
      } catch (error) {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function renderPreview() {
      validCount.textContent = currentLinks.length;
      blockedCount.textContent = currentBlocked.length;

      const items = currentLinks.slice(0, 12).map(url => (
        '<div class="link-item"><span title="' + escapeHtml(url) + '">' + escapeHtml(url) + '</span></div>'
      ));

      const blockedLabel = currentBlocked.length > 0
        ? '<div class="empty-preview">Link bị chặn:</div>'
        : '';

      const blockedItems = currentBlocked.slice(0, 6).map(url => (
        '<div class="link-item blocked"><span title="' + escapeHtml(url) + '">' + escapeHtml(url) + '</span></div>'
      ));

      const overflow = currentLinks.length > 12
        ? '<div class="empty-preview">Còn ' + (currentLinks.length - 12) + ' link hợp lệ khác.</div>'
        : '';

      const blockedOverflow = currentBlocked.length > 6
        ? '<div class="empty-preview">Còn ' + (currentBlocked.length - 6) + ' link bị chặn khác.</div>'
        : '';

      previewList.innerHTML = items.concat(overflow, blockedLabel, blockedItems, blockedOverflow).join('')
        || '<div class="empty-preview">Chưa có link hợp lệ.</div>';
    }

    function updateState() {
      const extracted = extractLinks(linkInput.value);
      currentLinks = extracted.links;
      currentBlocked = extracted.blocked;
      const hasProfile = Boolean(classSelect.value && studentName.value.trim());
      const blockedOk = !REJECT_IF_BLOCKED_LINKS_FOUND || currentBlocked.length === 0;
      submitBtn.disabled = !(hasProfile && currentLinks.length > 0 && blockedOk);
      renderPreview();
      saveProfile();
    }

    function setBusy(isBusy) {
      submitBtn.disabled = isBusy || submitBtn.disabled;
      submitBtn.textContent = isBusy ? 'Đang gửi...' : 'Gửi bài';
      classSelect.disabled = isBusy;
      studentName.disabled = isBusy;
      linkInput.disabled = isBusy;
      clearBtn.disabled = isBusy;
      connectionStatus.textContent = isBusy ? 'Đang gửi bài' : 'Sẵn sàng nhận bài';
      if (!isBusy) updateState();
    }

    function buildPayload(lop, hocVien, links) {
      return {
        records: links.map(link => ({
          fields: {
            'Lớp': lop,
            'Học viên': hocVien,
            'Bài luyện tập': link
          }
        }))
      };
    }

    async function submitLinks(event) {
      event.preventDefault();
      clearResult();
      updateState();

      const lop = classSelect.value;
      const hocVien = studentName.value.trim();
      if (!lop || !hocVien) {
        setResult('error', 'Vui lòng nhập đủ lớp và tên học viên.');
        return;
      }

      if (currentBlocked.length > 0 && REJECT_IF_BLOCKED_LINKS_FOUND) {
        setResult('error', 'Có link chatgpt.com/c không được chấp nhận. Vui lòng đổi sang link share.');
        return;
      }

      if (currentLinks.length === 0) {
        setResult('error', 'Chưa tìm thấy link hợp lệ.');
        return;
      }

      setBusy(true);

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(buildPayload(lop, hocVien, currentLinks))
        });

        const responseText = await response.text();
        if (!response.ok) {
          throw new Error(responseText || 'Webhook trả lỗi ' + response.status + '.');
        }

        linkInput.value = '';
        clearResult();
        setResult('ok', 'Đã gửi ' + currentLinks.length + ' link cho ' + hocVien + ' (' + lop + ').');
        currentLinks = [];
        currentBlocked = [];
        renderPreview();
        saveProfile();
      } catch (error) {
        setResult('error', 'Chưa gửi được bài. Vui lòng thử lại hoặc báo giáo viên.\n' + (error.message || 'Lỗi kết nối.'));
      } finally {
        setBusy(false);
      }
    }

    function clearLinks() {
      linkInput.value = '';
      currentLinks = [];
      currentBlocked = [];
      clearResult();
      renderPreview();
      updateState();
      linkInput.focus();
    }

    function init() {
      CLASS_LIST.slice().sort((a, b) => a.localeCompare(b, 'vi')).forEach(lop => {
        const option = document.createElement('option');
        option.value = lop;
        option.textContent = lop;
        classSelect.appendChild(option);
      });

      loadProfile();
      updateState();

      classSelect.addEventListener('change', updateState);
      studentName.addEventListener('input', updateState);
      linkInput.addEventListener('input', () => {
        clearResult();
        updateState();
      });
      submitForm.addEventListener('submit', submitLinks);
      clearBtn.addEventListener('click', clearLinks);
    }

    init();
  </script>
</body>
</html>
