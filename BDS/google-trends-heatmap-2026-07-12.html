<div id="bds-locality-search-heatmap" aria-labelledby="bds-locality-search-heatmap-label">
  <style>
    #bds-locality-search-heatmap {
      display: grid;
      gap: 1rem;
    }

    #bds-locality-search-heatmap .heat-inline-detail {
      display: grid;
      gap: 0.35rem;
      grid-column: 1 / -1;
    }

    #bds-locality-search-heatmap .heat-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    #bds-locality-search-heatmap .heat-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    #bds-locality-search-heatmap .heat-swatch {
      width: 0.9rem;
      height: 0.9rem;
      display: inline-block;
      border: 1px solid var(--border);
    }

    #bds-locality-search-heatmap .heat-swatch[data-band="0"],
    #bds-locality-search-heatmap .heat-tile[data-band="0"] {
      background: color-mix(in srgb, var(--muted) 35%, transparent);
    }

    #bds-locality-search-heatmap .heat-swatch[data-band="1"],
    #bds-locality-search-heatmap .heat-tile[data-band="1"] {
      background: color-mix(in srgb, var(--viz-series-1) 18%, transparent);
    }

    #bds-locality-search-heatmap .heat-swatch[data-band="2"],
    #bds-locality-search-heatmap .heat-tile[data-band="2"] {
      background: color-mix(in srgb, var(--viz-series-1) 36%, transparent);
    }

    #bds-locality-search-heatmap .heat-swatch[data-band="3"],
    #bds-locality-search-heatmap .heat-tile[data-band="3"] {
      background: color-mix(in srgb, var(--viz-series-1) 58%, transparent);
    }

    #bds-locality-search-heatmap .heat-groups {
      display: grid;
      gap: 1rem;
    }

    #bds-locality-search-heatmap .heat-group {
      display: grid;
      gap: 0.45rem;
    }

    #bds-locality-search-heatmap .heat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
      gap: 0.45rem;
    }

    #bds-locality-search-heatmap .heat-tile {
      min-height: 3rem;
      white-space: normal;
      text-align: left;
    }

    #bds-locality-search-heatmap .trend-mark {
      margin-inline-start: 0.35rem;
      font-size: 1.35em;
      font-weight: 800;
    }

    #bds-locality-search-heatmap .trend-mark[data-trend="up"] {
      color: var(--viz-series-2);
    }

    #bds-locality-search-heatmap .trend-mark[data-trend="down"] {
      color: var(--destructive);
    }

    #bds-locality-search-heatmap .trend-mark[data-trend="mixed"] {
      color: var(--viz-series-3);
    }

    #bds-locality-search-heatmap .trend-mark[data-trend="flat"],
    #bds-locality-search-heatmap .trend-mark[data-trend="unknown"] {
      color: var(--muted-foreground);
    }
  </style>

  <h2 id="bds-locality-search-heatmap-label" class="sr-only">Bản đồ nhiệt dải lượng tìm kiếm theo địa phương</h2>

    <span class="heat-legend-item"><span class="heat-swatch" data-band="2" aria-hidden="true"></span>100 – 1 N</span>
    <span class="heat-legend-item"><span class="heat-swatch" data-band="1" aria-hidden="true"></span>10 – 100</span>
    <span class="heat-legend-item"><span class="heat-swatch" data-band="0" aria-hidden="true"></span>Không hiện dải</span>
    <span class="heat-legend-item"><span class="trend-mark" data-trend="up" aria-hidden="true">↑</span>Tăng</span>
    <span class="heat-legend-item"><span class="trend-mark" data-trend="down" aria-hidden="true">↓</span>Giảm</span>

    <span class="heat-legend-item"><span class="trend-mark" data-trend="flat" aria-hidden="true">→</span>Đi ngang</span>

        if (!value || value === "—" || value === "+∞" || value === "-∞") {
          return null;
        }
        if (value.indexOf("+") === 0) {
          return 1;
        }
        if (value.indexOf("-") === 0) {
          return -1;
        }
        return value === "0%" ? 0 : null;
      }

      function trendFor(item) {
        var recent = changeSign(item.top3);
        var yearly = changeSign(item.topYoy);
        if (recent === null || yearly === null) {
          return "unknown";
        }
        if (recent === 0 && yearly === 0) {
          return "flat";
        }
        if ((recent > 0 && yearly >= 0) || (recent >= 0 && yearly > 0)) {
          return "up";
        }
        if ((recent < 0 && yearly <= 0) || (recent <= 0 && yearly < 0)) {
          return "down";
        }
        return "mixed";
      }

      function trendSymbol(trend) {
        return { up: "↑", down: "↓", mixed: "↕", flat: "→", unknown: "?" }[trend];
      }

      function trendLabel(trend) {
        return { up: "Tăng", down: "Giảm", mixed: "Trái chiều", flat: "Đi ngang", unknown: "Chưa rõ" }[trend];
      }

      function selectItem(item, button) {
        root.querySelectorAll(".heat-tile").forEach(function (tile) {
          tile.setAttribute("aria-pressed", "false");
        });
        if (activeDetail) {
          activeDetail.remove();
        }
        button.setAttribute("aria-pressed", "true");
        var trend = trendFor(item);
        var detail = document.createElement("section");
        detail.className = "card heat-inline-detail";
        detail.setAttribute("aria-live", "polite");
        var name = document.createElement("div");
        name.textContent = item.entity + " · " + item.level + " · " + item.parent;
        var band = document.createElement("div");
        band.className = "viz-stat-value";
        band.textContent = item.band + " · " + trendSymbol(trend) + " " + trendLabel(trend);
        var detailText = document.createElement("div");
        detailText.className = "text-small";
        detailText.textContent = "Từ khóa mạnh nhất: " + item.top + " · 3 tháng: " + item.top3 + " · so với năm trước: " + item.topYoy + " · " + item.withVolume + "/" + item.keywords + " từ khóa có dải.";
        var caution = document.createElement("div");
        caution.className = "text-small";
        caution.textContent = cautionFor(item);
        detail.appendChild(name);
        detail.appendChild(band);
        detail.appendChild(detailText);
        detail.appendChild(caution);
        button.insertAdjacentElement("afterend", detail);
        activeDetail = detail;
      }

      var grouped = {};
      data.forEach(function (item) {
        if (!grouped[item.province]) {
          grouped[item.province] = [];
        }
        grouped[item.province].push(item);
      });

      Object.keys(grouped).sort(function (a, b) {
        return a.localeCompare(b, "vi");
      }).forEach(function (province) {
        var section = document.createElement("section");
        section.className = "heat-group";
        var heading = document.createElement("h3");
        heading.textContent = province + " · " + grouped[province].length + " địa phương/cụm";
        var grid = document.createElement("div");
        grid.className = "heat-grid";
        grid.setAttribute("role", "group");
        grid.setAttribute("aria-label", province);

        grouped[province].forEach(function (item) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "btn viz-tile heat-tile";
          button.dataset.band = String(item.bandRank);
          var trend = trendFor(item);
          button.dataset.trend = trend;
          button.setAttribute("aria-pressed", "false");
          button.setAttribute("aria-label", item.entity + ", " + item.level + ", " + item.parent + ". Dải " + item.band + ". Hướng " + trendLabel(trend) + ". Từ khóa mạnh nhất: " + item.top + ".");
          button.setAttribute("data-tooltip", "3 tháng: " + item.top3 + " · so với năm trước: " + item.topYoy);
          var label = document.createElement("span");
          label.textContent = item.label;
          var marker = document.createElement("span");
          marker.className = "trend-mark";
          marker.dataset.trend = trend;
          marker.setAttribute("aria-hidden", "true");
          marker.textContent = trendSymbol(trend);
          button.appendChild(label);
          button.appendChild(marker);
          button.addEventListener("click", function () {
            selectItem(item, button);
          });
          grid.appendChild(button);
        });

        section.appendChild(heading);
        section.appendChild(grid);
        groupContainer.appendChild(section);
      });

    }());
  </script>
</div>
